name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - docs/**
      - LICENSE
      - .gitignore
      - "**/*.svg"
      - "**/*.png"
  pull_request:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - docs/**
      - LICENSE
      - .gitignore
      - "**/*.svg"
      - "**/*.png"

permissions:
  contents: read

env:
  # Required: go-finding uses encoding/json/v2 (Go experiment).
  GOEXPERIMENT: jsonv2
  # Pin the exact patch: setup-go's version manifest lags go.dev by hours,
  # so go-version "1.26" can resolve to an older patch than go.mod requires.
  # With GOTOOLCHAIN set, Go downloads the exact toolchain regardless.
  GOTOOLCHAIN: go1.26.7

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) v1.7.12
        shell: bash
      - name: Check workflow files
        run: ${{ steps.get_actionlint.outputs.executable }} -color
        shell: bash

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      # setup-go injects GOTOOLCHAIN=local via GITHUB_ENV, which overrides
      # the workflow-level env; only a step-level env wins that race.
      - run: go build ./...
        env:
          GOTOOLCHAIN: go1.26.7
      - run: go vet ./...
        env:
          GOTOOLCHAIN: go1.26.7
      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
        env:
          GOTOOLCHAIN: go1.26.7
      # Coverage measures the library only: examples/ are exercised via
      # exec.Command from integration tests, so their statements never
      # attribute and would dilute the total below the gate.
      - name: Run tests with coverage (library packages)
        run: go list ./... | grep -v /examples/ | xargs go test -race -count=1 -coverprofile=coverage.out -covermode=atomic
        env:
          GOTOOLCHAIN: go1.26.7
      - name: Check coverage threshold
        run: |
          total=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${total}%"
          if (( $(echo "$total < 90.0" | bc -l) )); then
            echo "::error::Coverage ${total}% is below 90% threshold"
            exit 1
          fi
        env:
          GOTOOLCHAIN: go1.26.7
    timeout-minutes: 15

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: --timeout=5m
      - name: Check formatting
        run: golangci-lint fmt --diff ./...
    timeout-minutes: 15

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...
    timeout-minutes: 15

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d # v16
      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@6221693898146dc97e38ad0e013488a16477a4c4 # v9
      - name: Check flake evaluates (treefmt derivation)
        run: nix flake check --no-build
    timeout-minutes: 15
