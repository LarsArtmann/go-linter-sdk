name: CI

# go-linter-sdk depends on go-finding v1.4.1 (a private repo) resolved from VCS
# via the module graph — no local replace directive. The Go jobs configure git
# to authenticate against GitHub using a PAT (PRIVATE_REPO_TOKEN) that has read
# access to both go-linter-sdk and go-finding. The default GITHUB_TOKEN is
# scoped to THIS repo only and cannot fetch go-finding (different private repo).
#
# Required secret:
#   PRIVATE_REPO_TOKEN — a PAT or fine-grained token with Contents:Read on
#   github.com/larsartmann/go-finding. Create under Settings → Secrets and
#   variables → Actions → New repository secret.

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - docs/**
      - LICENSE
      - .gitignore
      - "**/*.svg"
      - "**/*.png"
  pull_request:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - docs/**
      - LICENSE
      - .gitignore
      - "**/*.svg"
      - "**/*.png"

permissions:
  contents: read

env:
  # Required: go-finding uses encoding/json/v2 (Go experiment).
  GOEXPERIMENT: jsonv2
  # go-finding is a private repo; bypass the public proxy and fetch from VCS.
  GOPRIVATE: github.com/larsartmann/*,github.com/LarsArtmann/*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate git for private modules
        run: git config --global url."https://x-access-token:${{ secrets.PRIVATE_REPO_TOKEN }}@github.com".insteadOf "https://github.com"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - run: go build ./...
      - run: go vet ./...
      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
      - name: Check coverage threshold
        run: |
          total=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${total}%"
          if (( $(echo "$total < 90.0" | bc -l) )); then
            echo "::error::Coverage ${total}% is below 90% threshold"
            exit 1
          fi
    timeout-minutes: 15

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate git for private modules
        run: git config --global url."https://x-access-token:${{ secrets.PRIVATE_REPO_TOKEN }}@github.com".insteadOf "https://github.com"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m
      - name: Check formatting
        run: golangci-lint fmt --diff ./...
    timeout-minutes: 15

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate git for private modules
        run: git config --global url."https://x-access-token:${{ secrets.PRIVATE_REPO_TOKEN }}@github.com".insteadOf "https://github.com"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...
    timeout-minutes: 15

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d # v16
      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@6221693898146dc97e38ad0e013488a16477a4c4 # v9
      - name: Check flake evaluates (treefmt derivation)
        run: nix flake check --no-build
    timeout-minutes: 15
