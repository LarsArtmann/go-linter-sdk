version: "2"
run:
  timeout: 5m
  go: 1.26.4
  build-tags:
    - goexperiment.arenas
    - goexperiment.goroutineleakprofile
    - goexperiment.jsonv2
    - goexperiment.runtimesecret
    - goexperiment.simd
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
output:
  formats: {}
linters:
  enable:
    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - clickhouselint
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - depguard
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - ireturn
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint
  settings:
    cyclop:
      max-complexity: 25
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - github.com/larsartmann/go-finding
          deny:
            - desc: deprecated since Go 1.16, use io and os
              pkg: io/ioutil
          files:
            - $all
            - "!$test"
          list-mode: lax
        test:
          allow:
            - $gostd
            - github.com/larsartmann/go-finding
          files:
            - $test
          list-mode: lax
    exhaustruct:
      exclude:
        - os/exec.Cmd
    funlen:
      lines: 120
      statements: 80
    ginkgolinter:
      forbid-focus-container: true
      forbid-spec-pollution: true
    gocognit:
      min-complexity: 35
    gocritic:
      disabled-checks:
        - ifElseChain
    gocyclo:
      min-complexity: 25
    godot:
      scope: toplevel
    gomoddirectives:
      replace-local: true
    ireturn:
      allow:
        - error
        - empty
        - anon
        - stdlib
        - generic
        - github.com/larsartmann/go-finding.Detector
        - github.com/larsartmann/go-linter-sdk.Rule
    makezero:
      always: false
    nestif:
      min-complexity: 6
    revive:
      rules:
        - disabled: false
          name: unused-parameter
          severity: warning
        - name: unreachable-code
          severity: warning
        - name: context-as-argument
          severity: warning
        - name: error-return
          severity: warning
        - name: error-strings
          severity: warning
        - name: error-naming
          severity: warning
        - name: exported
          severity: warning
        - name: increment-decrement
          severity: warning
        - name: var-naming
          severity: warning
        - name: package-comments
          severity: warning
        - name: range
          severity: warning
        - name: receiver-naming
          severity: warning
        - name: time-naming
          severity: warning
        - name: unexported-return
          severity: warning
        - name: indent-error-flow
          severity: warning
        - name: errorf
          severity: warning
        - name: unnecessary-stmt
          severity: warning
        - name: unused-receiver
          severity: warning
    testifylint:
      disable:
        - go-require
      enable-all: true
    wrapcheck:
      ignore-package-globs:
        - github.com/larsartmann/go-finding/*
    varnamelen:
      # Minimal, first-principles list: only universally-conventional Go
      # abbreviations that the linter is wrong to flag. The inherited go-finding
      # list (30+ entries) was trimmed to exactly what earns its place here.
      ignore-map-index-ok: true
      ignore-type-assert-ok: true
      ignore-names:
        - err # error value
        - ok # comma-ok / map-index-ok result
        - i # loop index
        - t # *testing.T
        - r # registry / receiver
        - wg # sync.WaitGroup
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - err113
          - exhaustruct
          - goconst
          - wrapcheck
          - unparam
      - path: _test\.go
        text: unused
        linters:
          - unused
    paths:
      - \.gen\.go$
      - _templ\.go$
      - vendor/
formatters:
  enable:
    - gci
    - goimports
    - gofumpt
    - golines
  settings:
    golines:
      max-len: 120
  exclusions:
    generated: lax
    paths:
      - \.gen\.go$
      - _templ\.go$
      - vendor/
issues:
  max-issues-per-linter: 100
  max-same-issues: 5
